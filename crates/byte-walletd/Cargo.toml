[package]
name = "byte-walletd"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Asuzu"]
description = "Byte Protocol wallet sidecar: diversified addresses, shielded Ironwood sends, view-only verification"
repository = "https://github.com/Afghanistan8/byte-protocol"
publish = false

[dependencies]
# Zcash. Versions are pinned and recorded in docs/TOOLCHAIN.md with the date they were
# checked. The `orchard` feature is what makes Orchard receivers available; Ironwood
# reuses them, so it is required even though Byte never touches the Orchard pool.
# `transparent-inputs` is what makes the transparent side of the wallet exist at all:
# deriving transparent addresses, tracking their UTXOs, and selecting them as inputs
# for a shielding transaction. Byte never *spends* transparent value for a payment —
# `assert_ironwood_funded` refuses that — but shielding is precisely the operation that
# has to, and without this feature `propose_shielding` does not compile.
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling", "transparent-inputs"] }
# `sync` bundles the lightwalletd gRPC client and the scan loop; the tls feature is what
# lets it reach a public endpoint over https.
zcash_client_backend = { version = "0.24.0", features = [
    "sync",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "transparent-inputs",
    # `create_pczt_from_proposal` and `extract_and_store_transaction_from_pczt` live behind
    # this. Without it the split signer can review, sign and prove a PCZT and nothing can
    # produce one, which is a signing path with no way in and no way out.
    "pczt",
] }
# `serde` is not decoration: `create_pczt_from_proposal` requires the account id to be
# serializable, because a PCZT carries which account it belongs to, and `AccountUuid`
# derives Serialize only behind this feature.
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "transparent-inputs", "serde"] }
rusqlite = "0.37"
secrecy_zip32 = { package = "secrecy", version = "0.8" }
# `tls-webpki-roots` supplies the trust roots but no crypto backend; without `tls-ring`
# rustls panics at the first TLS handshake because it cannot pick a CryptoProvider.
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "channel",
    "codegen",
    "tls-ring",
    "tls-webpki-roots",
] }
rand = "0.8"
# BlockCache is declared with #[async_trait], so implementations must use it too.
async-trait = "0.1"
# Already in the tree via zcash_keys; named directly so shielding can talk about
# transparent addresses without going through an inference dance.
transparent = { package = "zcash_transparent", version = "0.10.0" }
zcash_protocol = "0.10.6"
zcash_address = "0.13.0"
zcash_primitives = "0.30.1"
zip321 = "0.9.0"
# Already in the tree via zcash_client_backend; named directly so split build/sign
# can use the roles. Pinned to the version docs/TOOLCHAIN.md records.
pczt = { version = "0.9.3", features = ["orchard", "prover", "signer"] }
orchard = { version = "0.15.5", features = ["circuit"] }
zip32 = "0.2"
# Sapling proving parameters. `create_proposed_transactions` requires a Sapling
# SpendProver and OutputProver in its signature even for an Ironwood-only transfer, so a
# real prover has to exist. `download-params` fetches them once into the standard
# location; `local-prover` finds them there afterwards.
zcash_proofs = { version = "0.30.0", features = ["local-prover", "download-params"] }

# Service
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.6", features = ["limit", "trace"] }

# Plumbing
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
# Wraps key material so it is zeroed on drop and cannot be printed by accident.
secrecy = "0.10.3"

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
