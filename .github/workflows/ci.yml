# Action versions here were checked against the GitHub API on 2026-09-29, not guessed.
#
# An earlier version of this workflow referenced actions/checkout@v5 and setup-node@v5. Those
# majors do not exist — the current ones are v7 — and an unresolvable action version fails the
# run at startup with "no jobs were run", which reads like a YAML problem and is not one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Demo
        # The demo is a deliverable too. If the protocol stops working end to end, this
        # fails alongside the unit tests rather than rotting unnoticed.
        run: pnpm demo

  rust:
    name: Rust (byte-walletd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/byte-walletd
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/byte-walletd

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

# The testnet end-to-end path is deliberately absent. It spends real TAZ and needs a funded
# wallet, so it is run by hand and its results are logged in docs/TESTNET_RUNS.md.
