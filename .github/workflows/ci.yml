name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest run per branch matters; cancel the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust (byte-walletd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/byte-walletd
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/byte-walletd

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

# The testnet end-to-end suite is deliberately absent from this workflow. It spends real
# TAZ and depends on a funded wallet, so it runs only via scripts/ with BYTE_TESTNET=1
# set by hand. See docs/TESTNET_RUNS.md for logged runs.
